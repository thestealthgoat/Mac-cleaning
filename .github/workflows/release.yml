name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # Signing and notarization switch on automatically when the repository
      # secrets exist (see docs/SIGNING.md). Without them the build is unsigned.
      - name: Set up code signing
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
            echo "CSC_LINK=$RUNNER_TEMP/developer-id.p12" >> "$GITHUB_ENV"
            echo "SILT_SIGNED=1" >> "$GITHUB_ENV"
            echo "Code signing: enabled"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "::warning::MAC_CERT_P12_BASE64 is not set — building an unsigned app."
          fi
          if [ -n "$MAC_CERT_P12_BASE64" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            # Catch copy-paste mistakes before a 10-minute build (values are never printed).
            KEY_ID="$(printf '%s' "$API_KEY_ID" | tr -d '[:space:]')"
            ISSUER="$(printf '%s' "$API_ISSUER" | tr -d '[:space:]')"
            if ! printf '%s' "$KEY_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
              echo "::error::APPLE_API_KEY_ID should be the 10-character Key ID (it is also in the .p8 file name: AuthKey_<KeyID>.p8)."
              exit 1
            fi
            if ! printf '%s' "$ISSUER" | grep -Eiq '^[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}$'; then
              echo "::error::APPLE_API_ISSUER should be the Issuer ID UUID shown above the Team Keys table in App Store Connect (Individual keys do not have one)."
              exit 1
            fi
            if ! grep -q 'BEGIN PRIVATE KEY' <<< "$APPLE_API_KEY_P8"; then
              echo "::error::APPLE_API_KEY_P8 does not look like the contents of an AuthKey_*.p8 file."
              exit 1
            fi
            echo "APPLE_API_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$ISSUER" >> "$GITHUB_ENV"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "SILT_NOTARIZED=1" >> "$GITHUB_ENV"
            echo "Notarization: enabled"
          else
            echo "::warning::Notarization is off — set MAC_CERT_P12_BASE64 and APPLE_API_KEY_P8."
          fi

      - name: Build
        run: npm run dist
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}

      - name: Verify signature and notarization
        if: env.SILT_SIGNED == '1'
        run: |
          for app in dist/mac*/Silt.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            if [ "$SILT_NOTARIZED" = "1" ]; then
              xcrun stapler validate "$app"
              spctl --assess --type execute --verbose=2 "$app"
            fi
          done

      - name: Remove signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*.zip
