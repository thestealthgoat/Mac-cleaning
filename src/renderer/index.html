<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <title>Silt</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="drag-region"></div>
      <div class="brand">
        <img class="brand-icon" src="assets/icon.png" alt="" width="34" height="34" />
        <div>
          <div class="brand-name">Silt</div>
          <div class="brand-tag">Storage, explained</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <main id="main">
      <div class="drag-region"></div>
      <div id="view"></div>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="errors.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
